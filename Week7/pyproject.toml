[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "week7-product-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.1,<4", "Flask-SQLAlchemy>=3.1,<4", "SQLAlchemy>=2.0,<3",
  "marshmallow>=4,<5", "Flask-Migrate>=4,<5", "python-dotenv>=1,<2",
  "psycopg[binary]>=3.2,<4", "gunicorn>=23,<24; sys_platform != 'win32'"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
