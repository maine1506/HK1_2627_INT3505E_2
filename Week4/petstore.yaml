openapi: 3.0.3
info:
  title: Pet Store
  version: 1.0.0

paths:
  /pets:
    get:
      operationId: listPets
      tags: [pets]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            maximum: 100
      responses:
        '200':
          description: Danh sách thú cưng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pets'
        default:
          description: Lỗi ngoài dự kiến
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      operationId: createPets
      tags: [pets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '201':
          description: Tạo thành công, không có response body
        default:
          description: Lỗi ngoài dự kiến
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /pets/{petId}:
    get:
      operationId: showPetById
      tags: [pets]
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Thông tin thú cưng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        default:
          description: Lỗi ngoài dự kiến
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        tag:
          type: string

    Pets:
      type: array
      maxItems: 100
      items:
        $ref: '#/components/schemas/Pet'

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string