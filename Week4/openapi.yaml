openapi: 3.0.3
info:
  title: Tasks API
  version: 1.0.0
  description: Quản lý task nội bộ
servers: [{ url: http://localhost:5000/v1 }]
tags: [{ name: tasks }]
security: [{ bearerAuth: [] }]

paths:
  /tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            maximum: 100
        - name: status
          in: query
          schema:
            type: string
            enum: [open, in_progress, completed]
      responses:
        "200":
          description: Danh sách task
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        default:
          $ref: "#/components/responses/Error"

    post:
      tags: [tasks]
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTask"
      responses:
        "201":
          description: Tạo task thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        default:
          $ref: "#/components/responses/Error"

  /tasks/{taskId}:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [tasks]
      operationId: getTaskById
      responses:
        "200":
          description: Chi tiết task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        default:
          $ref: "#/components/responses/Error"

    patch:
      tags: [tasks]
      operationId: patchTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTask"
      responses:
        "200":
          description: Task đã cập nhật
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        default:
          $ref: "#/components/responses/Error"

    delete:
      tags: [tasks]
      operationId: deleteTask
      responses:
        "204":
          description: Xóa thành công
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Task:
      type: object
      required: [id, title, status]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          type: string
          enum: [open, in_progress, completed]

    CreateTask:
      type: object
      required: [title]
      properties:
        title:
          type: string
        status:
          type: string
          enum: [open, in_progress, completed]

    UpdateTask:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
        status:
          type: string
          enum: [open, in_progress, completed]

    Error:
      type: object
      properties:
        message:
          type: string

  responses:
    Error:
      description: Lỗi API
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
